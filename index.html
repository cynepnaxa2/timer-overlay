<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay</title>
    <style>
      :root {
        --dot-size: 20px;
        --dot-color: rgba(255, 0, 0, 0.55);
        --duration: 60s;
        --timing: linear; /* or steps(60, end) */
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      /* Ensure renderer never captures events; Electron also ignores them at window level */
      body { pointer-events: none; }

      #overlay {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 4px;
      }
      .symbol-container {
        position: absolute;
        right: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        animation: rise var(--duration) var(--timing) infinite;
      }
      .symbol {
        width: var(--dot-size);
        height: var(--dot-size);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--dot-size) * 0.7);
        border-radius: 50%;
        background: var(--dot-color);
        box-shadow: 0 0 10px var(--shadow-color);
        color: white;
        text-shadow: 0 0 4px rgba(0, 0, 0, 0.5);
      }
      .counter {
        font-size: 10px;
        color: var(--counter-color);
        font-weight: 700;
        text-shadow: 0 0 3px rgba(0, 0, 0, 0.8), 0 0 1px rgba(255, 255, 255, 0.9);
        white-space: nowrap;
        background: rgba(0, 0, 0, 0.5);
        padding: 3px 8px;
        border-radius: 6px;
        min-width: 50px;
        text-align: center;
        backdrop-filter: blur(4px);
      }
      @keyframes rise {
        from { top: calc(100% - var(--dot-size)); }
        to   { top: calc(0px - var(--dot-size)); }
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="symbol-container">
        <div class="symbol" id="symbol">💵</div>
        <div class="counter" id="counter">$0</div>
      </div>
    </div>
    <script>
      const symbolEl = document.getElementById('symbol');
      const counterEl = document.getElementById('counter');
      const container = document.querySelector('.symbol-container');
      let currentMode = 'money';
      let lastVars = '';
      
      // Получаем режим и счетчик при загрузке
      if (window.overlayApi) {
        window.overlayApi.getMode().then(mode => {
          if (mode) {
            currentMode = mode.id;
            symbolEl.textContent = mode.emoji || mode.symbol || '💵';
            // Устанавливаем начальное значение счетчика
            counterEl.textContent = mode.format(0);
          }
        }).catch(() => {});
        
        // Обновление счетчика
        window.overlayApi.onCounterUpdated((data) => {
          if (data && data.value) {
            counterEl.textContent = data.value;
          }
        });
        
        // Обновление режима
        window.overlayApi.onModeUpdated((mode) => {
          if (mode) {
            currentMode = mode.id;
            symbolEl.textContent = mode.emoji || mode.symbol || '💵';
            // Сбрасываем счетчик при смене режима (или показываем текущий)
            counterEl.textContent = mode.format(0);
          }
        });
      } else {
        // Fallback если API не загружен
        symbolEl.textContent = '💵';
        counterEl.textContent = '$0';
      }
      
      function checkAndUpdate() {
        const computed = getComputedStyle(document.documentElement);
        const current = [
          computed.getPropertyValue('--dot-size'),
          computed.getPropertyValue('--dot-color'),
          computed.getPropertyValue('--duration'),
          computed.getPropertyValue('--timing')
        ].join('|');
        
        if (current !== lastVars) {
          lastVars = current;
          // Force animation restart
          container.style.animation = 'none';
          requestAnimationFrame(() => {
            container.style.animation = '';
          });
        }
      }
      
      // Check for CSS variable changes periodically
      setInterval(checkAndUpdate, 100);
    </script>
  </body>
  </html>
