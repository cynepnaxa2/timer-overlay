<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay</title>
    <style>
      :root {
        --dot-size: 20px;
        --dot-color: rgba(255, 0, 0, 0.55);
        --duration: 60s;
        --timing: linear; /* or steps(60, end) */
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      /* Ensure renderer never captures events; Electron also ignores them at window level */
      body { pointer-events: none; }

      #overlay {
        position: relative;
        width: 100%;
        height: 100%;
      }
      .dot {
        position: absolute;
        right: 0;
        width: var(--dot-size);
        height: var(--dot-size);
        border-radius: 50%;
        background: var(--dot-color); /* bright semi-transparent red */
        box-shadow: 0 0 10px rgba(255, 0, 0, 0.7);
        animation: rise var(--duration) var(--timing) infinite;
      }
      @keyframes rise {
        from { top: calc(100% - var(--dot-size)); }
        to   { top: calc(0px - var(--dot-size)); }
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="dot"></div>
    </div>
    <script>
      // Restart animation when CSS variables change
      const dot = document.querySelector('.dot');
      let lastVars = '';
      
      function checkAndUpdate() {
        const computed = getComputedStyle(document.documentElement);
        const current = [
          computed.getPropertyValue('--dot-size'),
          computed.getPropertyValue('--dot-color'),
          computed.getPropertyValue('--duration'),
          computed.getPropertyValue('--timing')
        ].join('|');
        
        if (current !== lastVars) {
          lastVars = current;
          // Force animation restart
          dot.style.animation = 'none';
          requestAnimationFrame(() => {
            dot.style.animation = '';
          });
        }
      }
      
      // Check for CSS variable changes periodically
      setInterval(checkAndUpdate, 100);
    </script>
  </body>
  </html>
