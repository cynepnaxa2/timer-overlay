<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Overlay</title>
    <style>
      :root {
        --dot-size: 20px;
        --dot-color: rgba(255, 0, 0, 0.55);
        --duration: 60s;
        --timing: linear; /* or steps(60, end) */
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      /* Ensure renderer never captures events; Electron also ignores them at window level */
      body { pointer-events: none; }

      #overlay {
        position: relative;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        padding-right: 4px;
      }
      .symbol-container {
        position: absolute;
        right: 10px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        animation: rise var(--duration) var(--timing) infinite;
        width: var(--dot-size);
        height: var(--dot-size);
        min-width: var(--dot-size);
      }
      /* Уровень 1 - Базовый: круг */
      .circle {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: var(--dot-color);
        box-shadow: 0 0 10px var(--shadow-color);
      }
      /* Уровень 2 - Продвинутый: только цифры */
      .counter-only {
        position: absolute;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--dot-size) * 1.2);
        color: var(--counter-color);
        font-weight: 900;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(255, 255, 255, 0.5);
        white-space: nowrap;
        text-align: center;
        line-height: 1;
      }
      /* Уровень 3 - Эксперт: символ + цифры рядом горизонтально */
      .symbol-container.expert {
        flex-direction: row;
        align-items: center;
        gap: 4px;
        width: auto;
        min-width: auto;
        max-width: 100%;
      }
      .symbol {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--dot-size) * 0.6);
        line-height: 1;
      }
      .counter {
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: calc(var(--dot-size) * 0.7);
        color: var(--counter-color);
        font-weight: 900;
        text-shadow: 0 0 8px rgba(0, 0, 0, 0.9), 0 0 4px rgba(255, 255, 255, 0.5);
        white-space: nowrap;
        line-height: 1;
      }
      .counter-value {
        font-size: calc(var(--dot-size) * 0.7);
      }
      .counter-unit {
        font-size: calc(var(--dot-size) * 0.5);
        opacity: 0.8;
        margin-left: 2px;
      }
      @keyframes rise {
        from { top: calc(100% - var(--dot-size)); }
        to   { top: calc(0px - var(--dot-size)); }
      }
    </style>
  </head>
  <body>
    <div id="overlay">
      <div class="symbol-container">
        <!-- Уровень 1: Круг -->
        <div class="circle" id="circle" style="display: none;"></div>
        <!-- Уровень 2: Только цифры -->
        <div class="counter-only" id="counterOnly" style="display: none;">0</div>
        <!-- Уровень 3: Символ + цифры + единица -->
        <div class="symbol" id="symbol" style="display: none;">💵</div>
        <div class="counter" id="counter" style="display: none;">
          <div class="counter-value" id="counterValue">0</div>
          <div class="counter-unit" id="counterUnit"></div>
        </div>
      </div>
    </div>
    <script>
      const circleEl = document.getElementById('circle');
      const counterOnlyEl = document.getElementById('counterOnly');
      const symbolEl = document.getElementById('symbol');
      const counterEl = document.getElementById('counter');
      const counterValueEl = document.getElementById('counterValue');
      const counterUnitEl = document.getElementById('counterUnit');
      const container = document.querySelector('.symbol-container');
      let currentMode = 'money';
      let currentLevel = 1;
      let lastVars = '';
      
      function updateDisplay(level, mode, counterData) {
        // Скрываем все элементы
        circleEl.style.display = 'none';
        counterOnlyEl.style.display = 'none';
        symbolEl.style.display = 'none';
        counterEl.style.display = 'none';
        
        currentLevel = level || 1;
        
        if (currentLevel === 1) {
          // Уровень 1: Базовый - только круг
          circleEl.style.display = 'block';
        } else if (currentLevel === 2) {
          // Уровень 2: Продвинутый - только цифры
          counterOnlyEl.style.display = 'flex';
          if (counterData && counterData.value !== undefined) {
            counterOnlyEl.textContent = counterData.value;
          } else {
            counterOnlyEl.textContent = '0';
          }
        } else if (currentLevel === 3) {
          // Уровень 3: Эксперт - символ + цифры рядом горизонтально
          const container = document.querySelector('.symbol-container');
          if (container) {
            container.classList.add('expert');
          }
          if (mode) {
            symbolEl.style.display = 'flex';
            symbolEl.textContent = mode.emoji || mode.symbol || '💵';
            currentMode = mode.id;
          }
          counterEl.style.display = 'flex';
          if (counterData) {
            if (counterData.value !== undefined) {
              counterValueEl.textContent = counterData.value;
            }
            // В экспертном режиме не показываем единицы измерения
            counterUnitEl.textContent = '';
          } else {
            counterValueEl.textContent = '0';
            counterUnitEl.textContent = '';
          }
        } else {
          // Убираем класс expert для других уровней
          const container = document.querySelector('.symbol-container');
          if (container) {
            container.classList.remove('expert');
          }
        }
      }
      
      function updateSymbol(mode) {
        if (!mode) return;
        currentMode = mode.id;
        if (currentLevel === 3) {
          symbolEl.textContent = mode.emoji || mode.symbol || '💵';
          // В экспертном режиме не показываем единицы измерения
          counterUnitEl.textContent = '';
        }
      }
      
      // Получаем уровень, режим и счетчик при загрузке
      if (window.overlayApi) {
        Promise.all([
          window.overlayApi.getSettings ? window.overlayApi.getSettings() : Promise.resolve({ level: 1 }),
          window.overlayApi.getMode(),
          window.overlayApi.getCurrentCounter ? window.overlayApi.getCurrentCounter() : Promise.resolve(null)
        ]).then(([settings, mode, counter]) => {
          const level = settings.level || 1;
          const counterValue = counter ? counter.value : '0';
          updateDisplay(level, mode, { value: counterValue, counter: counter?.counter });
        }).catch(() => {
          updateDisplay(1, null, { value: '0' });
        });
        
        // Обновление счетчика
        window.overlayApi.onCounterUpdated((data) => {
          if (data && data.value !== undefined) {
            if (currentLevel === 2) {
              counterOnlyEl.textContent = data.value;
            } else if (currentLevel === 3) {
              counterValueEl.textContent = data.value;
              // В экспертном режиме не показываем единицы измерения
              counterUnitEl.textContent = '';
              if (data.mode) {
                updateSymbol(data.mode);
              }
            }
          }
        });
        
        // Обновление режима
        window.overlayApi.onModeUpdated((mode) => {
          if (mode) {
            if (currentLevel === 3) {
              updateSymbol(mode);
              if (window.overlayApi && window.overlayApi.getCurrentCounter) {
                window.overlayApi.getCurrentCounter().then(counter => {
                  if (counter) {
                    counterValueEl.textContent = counter.value || '0';
                  } else {
                    counterValueEl.textContent = '0';
                  }
                  // В экспертном режиме не показываем единицы измерения
                  counterUnitEl.textContent = '';
                }).catch(() => {});
              }
            } else if (currentLevel === 2) {
              // Для уровня 2 обновляем только счетчик
              if (window.overlayApi && window.overlayApi.getCurrentCounter) {
                window.overlayApi.getCurrentCounter().then(counter => {
                  if (counter) {
                    counterOnlyEl.textContent = counter.value || '0';
                  } else {
                    counterOnlyEl.textContent = '0';
                  }
                }).catch(() => {});
              }
            }
          }
        });
        
        // Обновление уровня
        if (window.overlayApi.onLevelUpdated) {
          window.overlayApi.onLevelUpdated((level) => {
            if (window.overlayApi && window.overlayApi.getMode) {
              window.overlayApi.getMode().then(mode => {
                if (window.overlayApi && window.overlayApi.getCurrentCounter) {
                  window.overlayApi.getCurrentCounter().then(counter => {
                    const counterValue = counter ? counter.value : '0';
                    updateDisplay(level, mode, { value: counterValue, counter: counter?.counter });
                  }).catch(() => {
                    updateDisplay(level, mode, { value: '0' });
                  });
                } else {
                  updateDisplay(level, mode, { value: '0' });
                }
              }).catch(() => {
                updateDisplay(level, null, { value: '0' });
              });
            }
          });
        }
      } else {
        // Fallback если API не загружен
        updateDisplay(1, null, { value: '0' });
      }
      
      function checkAndUpdate() {
        const computed = getComputedStyle(document.documentElement);
        const current = [
          computed.getPropertyValue('--dot-size'),
          computed.getPropertyValue('--dot-color'),
          computed.getPropertyValue('--duration'),
          computed.getPropertyValue('--timing')
        ].join('|');
        
        if (current !== lastVars) {
          lastVars = current;
          // Force animation restart
          container.style.animation = 'none';
          requestAnimationFrame(() => {
            container.style.animation = '';
          });
        }
      }
      
      // Check for CSS variable changes periodically
      setInterval(checkAndUpdate, 100);
    </script>
  </body>
  </html>
