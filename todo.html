<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Todo List</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        overflow: hidden;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        flex-direction: column;
      }
      #todo-container {
        width: 100%;
        flex: 1;
        position: relative;
        overflow-x: hidden;
        overflow-y: auto;
        margin-top: 0;
      }
      #todo-container-inner {
        position: relative;
        width: 100%;
        min-height: 100%;
      }
      #todo-header {
        position: relative;
        width: 100%;
        height: 60px;
        background: #252525;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        align-items: center;
        padding: 0 20px;
        z-index: 1000;
        flex-shrink: 0;
      }
      .btn-primary {
        background: #4a9eff;
        color: #fff;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 500;
        transition: background 0.2s;
      }
      .btn-primary:hover {
        background: #357abd;
      }
      #hierarchy-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
      }
      .task {
        width: 100%;
        min-height: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        position: relative;
        align-items: center;
      }
      .task.dragging {
        opacity: 0.5;
      }
      .task.drag-over {
        border-top: 2px solid rgba(255, 255, 255, 0.8);
      }
      .task.drag-over-inside {
        background: rgba(255, 255, 255, 0.1);
      }
      .task-expander {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: inherit;
        user-select: none;
        align-self: center;
      }
      .task-expander:hover {
        opacity: 0.8;
      }
      .task-expander-icon {
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hierarchy-svg-line {
        stroke: rgba(255, 255, 255, 0.6);
        stroke-width: 0.5;
        fill: none;
      }
      .task-content {
        flex: 1;
        min-width: 0;
        min-height: 40px;
        padding: 12px;
        outline: none;
        word-wrap: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow: hidden;
        resize: none;
        color: #fff;
        background: transparent;
      }
      .task-content:focus {
        background: rgba(255, 255, 255, 0.05);
      }
      .task-actions {
        display: none;
        padding: 8px 12px 8px 12px;
        padding-right: 24px;
        background: rgba(0, 0, 0, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: nowrap;
      }
      .task.active .task-actions {
        display: flex;
        gap: 8px;
      }
      .task-actions button {
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
      }
      .task-actions button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="todo-header">
      <button class="btn-primary" id="btn-create-root" title="Shift+Enter">Создать корневую задачу</button>
      <button class="btn-primary" id="btn-create-sibling" title="Enter" style="margin-left: 10px;">Создать соседнюю задачу</button>
    </div>
    <div id="todo-container">
      <div id="todo-container-inner">
        <svg id="hierarchy-svg" xmlns="http://www.w3.org/2000/svg"></svg>
      </div>
    </div>
    <script src="src/todo/state.js"></script>
    <script src="src/todo/hierarchy.js"></script>
    <script src="src/todo/hierarchyLines.js"></script>
    <script src="src/todo/dragDrop.js"></script>
    <script src="src/todo/hotkeys.js"></script>
    <script src="src/utils/richEditor.js"></script>
    <script src="src/todo/renderer.js"></script>
    <script>
      const state = window.todoState.createTodoState();
      const renderer = window.todoRenderer;
      const hotkeys = window.todoHotkeys;
      
      const doRefresh = () => renderer.refreshTodos(state);
      const doFocus = (id) => renderer.focusTask(id, state);
      
      const container = document.getElementById('todo-container');
      const innerContainer = document.getElementById('todo-container-inner');
      
      if (container) {
        let scrollTimeout = null;
        container.addEventListener('scroll', () => {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            if (state.currentTodos) window.todoHierarchyLines.drawHierarchyLines(state.currentTodos, innerContainer);
          }, 50);
        });
      }
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.task')) {
          document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
          state.activeTaskId = null;
        }
      });
      
      hotkeys.setupHotkeys(state, doRefresh, doFocus);

      document.getElementById('btn-create-root').addEventListener('click', () => {
        renderer.createAndFocusTask(null, state, doRefresh);
      });

      document.getElementById('btn-create-sibling').addEventListener('click', () => {
        let parentId = null;
        if (state.activeTaskId) {
          const task = state.currentTodos.find(t => t.id === state.activeTaskId);
          if (task) parentId = task.parentId;
        }
        renderer.createAndFocusTask(parentId, state, doRefresh);
      });
      
      if (window.todoApi) {
        window.todoApi.getTodoHotkeys().then(hks => { if (hks) state.todoHotkeys = hks; });
        
        window.todoApi.getTodos().then(async todos => {
          if (todos.length === 0) {
            await window.todoApi.loadLargeDemo();
            todos = await window.todoApi.getTodos();
          }
          renderer.renderTasks(todos, false, state);
        });
        
        window.todoApi.onTodosUpdated(todos => {
          renderer.renderTasks(todos, state.focusedElement !== null, state);
        });
        window.todoApi.onSettingsUpdated(s => { if (s.todoHotkeys) state.todoHotkeys = s.todoHotkeys; });
      }
    </script>
  </body>
</html>
