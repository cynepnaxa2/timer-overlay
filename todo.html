<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Todo List</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100%;
        height: 100vh;
        overflow-x: hidden;
        overflow-y: auto;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #todo-container {
        width: 100%;
        max-width: 100%;
        position: relative;
        overflow-x: hidden;
      }
      #hierarchy-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
      }
      .task {
        width: 100%;
        min-height: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        position: relative;
        align-items: center;
      }
      .task.dragging {
        opacity: 0.5;
      }
      .task.drag-over {
        border-top: 2px solid rgba(255, 255, 255, 0.8);
      }
      .task.drag-over-inside {
        background: rgba(255, 255, 255, 0.1);
      }
      .task-expander {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: inherit;
        user-select: none;
        align-self: center;
      }
      .task-expander:hover {
        opacity: 0.8;
      }
      .task-expander-icon {
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hierarchy-svg-line {
        stroke: rgba(255, 255, 255, 0.6);
        stroke-width: 0.5;
        fill: none;
      }
      .task-content {
        flex: 1;
        min-width: 0;
        min-height: 40px;
        padding: 12px;
        outline: none;
        word-wrap: break-word;
        white-space: pre-wrap;
        overflow-wrap: break-word;
        overflow: hidden;
        resize: none;
        color: #fff;
        background: transparent;
      }
      .task-content:focus {
        background: rgba(255, 255, 255, 0.05);
      }
      .task-actions {
        display: none;
        padding: 8px 12px 8px 12px;
        padding-right: 24px;
        background: rgba(0, 0, 0, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: nowrap;
      }
      .task.active .task-actions {
        display: flex;
        gap: 8px;
      }
      .task-actions button {
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
      }
      .task-actions button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="todo-container">
      <svg id="hierarchy-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <script src="src/todo/state.js"></script>
    <script src="src/todo/hierarchy.js"></script>
    <script src="src/todo/hierarchyLines.js"></script>
    <script src="src/todo/dragDrop.js"></script>
    <script src="src/todo/hotkeys.js"></script>
    <script src="src/utils/richEditor.js"></script>
    <script src="src/todo/renderer.js"></script>
    <script>
      const state = window.todoState.createTodoState();
      const renderer = window.todoRenderer;
      const hotkeys = window.todoHotkeys;
      const hierarchyLines = window.todoHierarchyLines;
      
      function refreshTodos() {
        return renderer.refreshTodos(state);
      }
      
      function focusTask(taskId) {
        return renderer.focusTask(taskId, state);
      }
      
      const container = document.getElementById('todo-container');
      let scrollTimeout = null;
      if (container) {
        container.addEventListener('scroll', () => {
          clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            if (state.currentTodos) {
              hierarchyLines.drawHierarchyLines(state.currentTodos, container);
            }
          }, 50);
        });
      }
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.task')) {
          document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
          state.activeTaskId = null;
        }
      });
      
      if (!window.todoRenderer || !window.todoHotkeys || !window.todoHierarchyLines || !window.todoState) {
        console.error('Modules not loaded:', {
          todoRenderer: !!window.todoRenderer,
          todoHotkeys: !!window.todoHotkeys,
          todoHierarchyLines: !!window.todoHierarchyLines,
          todoState: !!window.todoState
        });
        console.error('Waiting for modules to load...');
      }
      
      hotkeys.setupHotkeys(state, refreshTodos, focusTask);
      
      if (window.todoApi) {
        window.todoApi.getTodoHotkeys().then(hotkeys => {
          state.todoHotkeys = hotkeys;
        }).catch(err => console.error('Error loading hotkeys:', err));
        
        window.todoApi.getTodos().then(async todos => {
          if (todos.length === 0) {
            try {
              await window.todoApi.loadLargeDemo();
              todos = await window.todoApi.getTodos();
            } catch (err) {
              console.error('Error loading demo:', err);
              todos = [];
            }
          }
          renderer.renderTasks(todos, false, state);
        }).catch(err => {
          console.error('Error loading todos:', err);
        });
        
        window.todoApi.onTodosUpdated((todos) => {
          renderer.renderTasks(todos, state.focusedElement !== null, state);
        });
      } else {
        console.error('window.todoApi is not available');
      }
      
      window.loadLargeDemo = async function() {
        if (window.todoApi) {
          await window.todoApi.loadLargeDemo();
          renderer.renderTasks(await window.todoApi.getTodos(), false, state);
        }
      };
    </script>
  </body>
</html>
