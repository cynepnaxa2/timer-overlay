<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Todo List</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow-y: auto;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #todo-container {
        width: 100%;
        position: relative;
      }
      .task {
        width: 100%;
        min-height: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        position: relative;
      }
      .task-hierarchy {
        position: relative;
        flex-shrink: 0;
        width: 10px;
        min-width: 10px;
      }
      .hierarchy-line {
        position: absolute;
        background: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        z-index: 0;
      }
      .hierarchy-line-vertical {
        width: 1px;
      }
      .hierarchy-line-horizontal {
        height: 1px;
      }
      .hierarchy-dot {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
      }
      .task-content {
        position: relative;
        z-index: 1;
      }
      .task-group-separator {
        height: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .task-content {
        width: 100%;
        min-height: 40px;
        padding: 12px;
        outline: none;
        word-wrap: break-word;
        white-space: pre-wrap;
        overflow: hidden;
        resize: none;
        color: #fff;
        background: transparent;
      }
      .task-content:focus {
        background: rgba(255, 255, 255, 0.05);
      }
      .task-actions {
        display: none;
        padding: 8px 12px 8px 12px;
        padding-right: 24px;
        background: rgba(0, 0, 0, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: nowrap;
      }
      .task.active .task-actions {
        display: flex;
        gap: 8px;
      }
      .task-actions button {
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
      }
      .task-actions button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="todo-container"></div>
    <script>
      const COLORS = ['#8B00FF', '#0000FF', '#00FFFF', '#00FF00', '#FFFF00', '#FF7F00', '#FF0000'];
      
      function getColorForLevel(level) {
        if (level < 0) return COLORS[0];
        if (level >= COLORS.length) return COLORS[COLORS.length - 1];
        return COLORS[level];
      }
      
      function calculateLevel(task, todos) {
        if (!task.parentId) return 0;
        const parent = todos.find(t => t.id === task.parentId);
        if (!parent) return 0;
        return calculateLevel(parent, todos) + 1;
      }
      
      function getAncestors(task, todos) {
        const ancestors = [];
        let current = task;
        while (current.parentId) {
          const parent = todos.find(t => t.id === current.parentId);
          if (!parent) break;
          ancestors.push(parent);
          current = parent;
        }
        return ancestors.reverse();
      }
      
      function shouldContinueAncestorLine(ancestor, currentTask, todos) {
        const ancestorChildren = todos.filter(t => t.parentId === ancestor.id && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
        if (ancestorChildren.length === 0) return false;
        
        const lastChild = ancestorChildren[ancestorChildren.length - 1];
        if (isTaskDescendant(lastChild, currentTask, todos)) {
          return false;
        }
        
        let foundCurrent = false;
        for (const child of ancestorChildren) {
          if (isTaskDescendant(child, currentTask, todos)) {
            foundCurrent = true;
            continue;
          }
          if (foundCurrent) {
            return true;
          }
        }
        return false;
      }
      
      function isTaskDescendant(ancestor, task, todos) {
        if (ancestor.id === task.id) return true;
        const children = todos.filter(t => t.parentId === ancestor.id && !t.completed);
        for (const child of children) {
          if (isTaskDescendant(child, task, todos)) return true;
        }
        return false;
      }
      
      function autoResize(element) {
        if (!element) return;
        const currentHeight = element.style.height;
        element.style.height = 'auto';
        const scrollHeight = element.scrollHeight;
        const minHeight = 40;
        const newHeight = Math.max(minHeight, scrollHeight);
        element.style.height = newHeight + 'px';
      }
      
      let updateTimeout = null;
      let focusedElement = null;
      let focusedTaskId = null;
      let activeTaskId = null;
      let currentTodos = [];
      let todoHotkeys = {
        addSubtask: 'Insert',
        execute: 'F5',
        complete: 'Delete'
      };
      
      function parseHotkey(hotkeyString) {
        const parts = hotkeyString.split('+').map(p => p.trim());
        const modifiers = {
          ctrl: false,
          alt: false,
          shift: false,
          meta: false
        };
        let key = null;
        
        for (const part of parts) {
          const lower = part.toLowerCase();
          if (lower === 'ctrl' || lower === 'control') {
            modifiers.ctrl = true;
          } else if (lower === 'alt') {
            modifiers.alt = true;
          } else if (lower === 'shift') {
            modifiers.shift = true;
          } else if (lower === 'meta' || lower === 'cmd') {
            modifiers.meta = true;
          } else {
            key = part;
          }
        }
        
        return { modifiers, key };
      }
      
      function matchesHotkey(event, hotkeyString) {
        const parsed = parseHotkey(hotkeyString);
        const eventKey = event.key;
        const eventCode = event.code;
        
        const keyMap = {
          'Insert': 'Insert',
          'Delete': 'Delete',
          'F5': 'F5',
          'Enter': 'Enter',
          'Space': ' ',
          'Esc': 'Escape'
        };
        
        let keyMatches = false;
        if (keyMap[parsed.key]) {
          keyMatches = keyMap[parsed.key] === eventKey;
        } else if (parsed.key && parsed.key.length === 1) {
          keyMatches = parsed.key.toLowerCase() === eventKey.toLowerCase() || 
                       parsed.key === eventKey ||
                       parsed.key === eventCode;
        } else {
          keyMatches = parsed.key === eventKey || parsed.key === eventCode;
        }
        
        if (!keyMatches) return false;
        
        if (parsed.modifiers.ctrl !== event.ctrlKey) return false;
        if (parsed.modifiers.alt !== event.altKey) return false;
        if (parsed.modifiers.shift !== event.shiftKey) return false;
        if (parsed.modifiers.meta !== event.metaKey) return false;
        
        return true;
      }
      
      function setupRichEditor(element, taskId) {
        element.addEventListener('focus', () => {
          focusedElement = element;
          focusedTaskId = taskId;
        });
        
        element.addEventListener('blur', () => {
          if (focusedElement === element) {
            focusedElement = null;
            focusedTaskId = null;
          }
        });
        
        element.addEventListener('input', () => {
          autoResize(element);
          if (window.todoApi) {
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => {
              window.todoApi.updateTodo(taskId, { content: element.innerHTML });
            }, 300);
          }
        });
        
        element.addEventListener('paste', (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          const selection = window.getSelection();
          if (!selection.rangeCount) return;
          
          const range = selection.getRangeAt(0);
          range.deleteContents();
          const textNode = document.createTextNode(text);
          range.insertNode(textNode);
          range.setStartAfter(textNode);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          
          autoResize(element);
          if (window.todoApi) {
            window.todoApi.updateTodo(taskId, { content: element.innerHTML });
          }
        });
        
        setTimeout(() => {
          autoResize(element);
        }, 0);
      }
      
      function createTaskActions(taskId) {
        const actionsEl = document.createElement('div');
        actionsEl.className = 'task-actions';
        
        const addSubtaskBtn = document.createElement('button');
        addSubtaskBtn.textContent = '+';
        addSubtaskBtn.title = 'Добавить подзадачу';
        addSubtaskBtn.dataset.action = 'add-subtask';
        addSubtaskBtn.onclick = (e) => {
          e.stopPropagation();
          if (window.todoApi) {
            window.todoApi.createTodo('', taskId).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        };
        
        const executeBtn = document.createElement('button');
        executeBtn.textContent = '▶';
        executeBtn.title = 'Выполнить';
        executeBtn.dataset.action = 'execute';
        executeBtn.onclick = (e) => {
          e.stopPropagation();
          const task = currentTodos.find(t => t.id === taskId);
          if (window.todoApi && task) {
            window.todoApi.startTimer(task.motivationWord || null);
          }
        };
        
        const completeBtn = document.createElement('button');
        completeBtn.textContent = '✓';
        completeBtn.title = 'Выполнено';
        completeBtn.dataset.action = 'complete';
        completeBtn.onclick = (e) => {
          e.stopPropagation();
          if (window.todoApi) {
            window.todoApi.updateTodo(taskId, { 
              completed: true, 
              completedAt: Date.now() 
            }).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        };
        
        actionsEl.appendChild(addSubtaskBtn);
        actionsEl.appendChild(executeBtn);
        actionsEl.appendChild(completeBtn);
        
        return actionsEl;
      }
      
      function hasChildren(task, todos) {
        return todos.some(t => t.parentId === task.id && !t.completed);
      }
      
      function getSiblings(task, todos) {
        if (!task.parentId) {
          return todos.filter(t => !t.parentId && !t.completed && t.id !== task.id);
        }
        return todos.filter(t => t.parentId === task.parentId && !t.completed && t.id !== task.id);
      }
      
      function isLastChild(task, todos) {
        if (!task.parentId) {
          const rootTasks = todos.filter(t => !t.parentId && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
          return rootTasks.length === 0 || rootTasks[rootTasks.length - 1].id === task.id;
        }
        const siblings = todos.filter(t => t.parentId === task.parentId && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
        return siblings.length === 0 || siblings[siblings.length - 1].id === task.id;
      }
      
      function createTaskHierarchy(task, todos) {
        const currentLevel = calculateLevel(task, todos);
        
        const hierarchyEl = document.createElement('div');
        hierarchyEl.className = 'task-hierarchy';
        hierarchyEl.style.width = `${10 + currentLevel * 10}px`;
        hierarchyEl.style.minWidth = `${10 + currentLevel * 10}px`;
        
        return hierarchyEl;
      }
      
      function getLastDescendant(task, todos) {
        const children = todos.filter(t => t.parentId === task.id && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
        if (children.length === 0) return task;
        return getLastDescendant(children[children.length - 1], todos);
      }
      
      function drawHierarchyLines(todos, container) {
        container.querySelectorAll('.hierarchy-line').forEach(el => el.remove());
        container.querySelectorAll('.hierarchy-dot').forEach(el => el.remove());
        
        const taskElements = Array.from(container.querySelectorAll('.task'));
        const taskElementMap = new Map();
        const tasksInOrder = [];
        taskElements.forEach(el => {
          const taskId = el.dataset.taskId;
          if (taskId) {
            taskElementMap.set(taskId, el);
            tasksInOrder.push({ id: taskId, element: el });
          }
        });
        
        const getTaskPosition = (taskId) => {
          const el = taskElementMap.get(taskId);
          if (!el) return null;
          const rect = el.getBoundingClientRect();
          const containerRect = container.getBoundingClientRect();
          return {
            top: rect.top - containerRect.top + container.scrollTop,
            height: rect.height,
            center: rect.top - containerRect.top + container.scrollTop + rect.height / 2,
            bottom: rect.top - containerRect.top + container.scrollTop + rect.height
          };
        };
        
        const getTaskIndex = (taskId) => {
          return tasksInOrder.findIndex(t => t.id === taskId);
        };
        
        const findNextSiblingAtLevel = (taskId, targetLevel, startIndex) => {
          for (let i = startIndex + 1; i < tasksInOrder.length; i++) {
            const nextTaskId = tasksInOrder[i].id;
            const nextTask = todos.find(t => t.id === nextTaskId && !t.completed);
            if (!nextTask) continue;
            const nextTaskLevel = calculateLevel(nextTask, todos);
            if (nextTaskLevel === targetLevel) {
              return nextTask;
            }
            if (nextTaskLevel < targetLevel) {
              return null;
            }
          }
          return null;
        };
        
        todos.filter(t => !t.completed).forEach(task => {
          const taskPos = getTaskPosition(task.id);
          if (!taskPos) return;
          
          const level = calculateLevel(task, todos);
          const lineX = 9 + level * 10;
          
          if (task.parentId) {
            const parent = todos.find(t => t.id === task.parentId);
            if (parent) {
              const parentLevel = calculateLevel(parent, todos);
              const parentLineX = 9 + parentLevel * 10;
              
              const horizontalLine = document.createElement('div');
              horizontalLine.className = 'hierarchy-line hierarchy-line-horizontal';
              horizontalLine.style.left = `${parentLineX}px`;
              horizontalLine.style.top = `${taskPos.center}px`;
              horizontalLine.style.width = `${10}px`;
              container.appendChild(horizontalLine);
              
              const dot = document.createElement('div');
              dot.className = 'hierarchy-dot';
              dot.style.left = `${parentLineX + 10 - 2}px`;
              dot.style.top = `${taskPos.center - 2}px`;
              container.appendChild(dot);
            }
          } else {
            const horizontalLine = document.createElement('div');
            horizontalLine.className = 'hierarchy-line hierarchy-line-horizontal';
            horizontalLine.style.left = `${lineX}px`;
            horizontalLine.style.top = `${taskPos.center}px`;
            horizontalLine.style.width = `${10}px`;
            container.appendChild(horizontalLine);
            
            const dot = document.createElement('div');
            dot.className = 'hierarchy-dot';
            dot.style.left = `${lineX - 2}px`;
            dot.style.top = `${taskPos.center - 2}px`;
            container.appendChild(dot);
          }
        });
        
        const drawnVerticalLines = new Set();
        const parentTasks = todos.filter(t => !t.completed && hasChildren(t, todos));
        
        parentTasks.forEach(parentTask => {
          const parentLevel = calculateLevel(parentTask, todos);
          const lineKey = `v-${parentTask.id}`;
          if (drawnVerticalLines.has(lineKey)) return;
          drawnVerticalLines.add(lineKey);
          
          const parentPos = getTaskPosition(parentTask.id);
          if (!parentPos) return;
          
          const parentIndex = getTaskIndex(parentTask.id);
          if (parentIndex === -1) return;
          
          const nextSibling = findNextSiblingAtLevel(parentTask.id, parentLevel, parentIndex);
          
          let lineBottom;
          if (nextSibling) {
            const nextSiblingPos = getTaskPosition(nextSibling.id);
            if (nextSiblingPos) {
              lineBottom = nextSiblingPos.top;
            } else {
              const lastDescendant = getLastDescendant(parentTask, todos);
              const lastDescendantPos = getTaskPosition(lastDescendant.id);
              lineBottom = lastDescendantPos ? lastDescendantPos.center : parentPos.center;
            }
          } else {
            const lastDescendant = getLastDescendant(parentTask, todos);
            const lastDescendantPos = getTaskPosition(lastDescendant.id);
            if (lastDescendantPos) {
              lineBottom = lastDescendantPos.center;
            } else {
              lineBottom = parentPos.center;
            }
          }
          
          const lineX = 9 + parentLevel * 10;
          const verticalLine = document.createElement('div');
          verticalLine.className = 'hierarchy-line hierarchy-line-vertical';
          verticalLine.style.left = `${lineX}px`;
          verticalLine.style.top = `${parentPos.center}px`;
          verticalLine.style.height = `${Math.max(0, lineBottom - parentPos.center)}px`;
          container.appendChild(verticalLine);
        });
      }
      
      function renderTask(task, todos, container) {
        const level = calculateLevel(task, todos);
        
        let taskEl = container.querySelector(`[data-task-id="${task.id}"]`);
        
        if (!taskEl) {
          taskEl = document.createElement('div');
          taskEl.className = 'task';
          taskEl.dataset.taskId = task.id;
          if (task.parentId) {
            taskEl.classList.add('has-parent');
          }
          
          const hierarchyEl = createTaskHierarchy(task, todos);
          
          const contentEl = document.createElement('div');
          contentEl.className = 'task-content';
          contentEl.contentEditable = 'true';
          contentEl.spellcheck = false;
          contentEl.innerHTML = task.content || '';
          
          contentEl.setAttribute('data-click-handler', 'true');
          contentEl.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
            taskEl.classList.add('active');
            activeTaskId = task.id;
          });
          
          const actionsEl = createTaskActions(task.id);
          
          taskEl.appendChild(hierarchyEl);
          taskEl.appendChild(contentEl);
          taskEl.appendChild(actionsEl);
          container.appendChild(taskEl);
          
          setupRichEditor(contentEl, task.id);
          requestAnimationFrame(() => {
            autoResize(contentEl);
            setTimeout(() => {
              drawHierarchyLines(currentTodos, container);
            }, 0);
          });
        } else {
          if (task.parentId) {
            taskEl.classList.add('has-parent');
          } else {
            taskEl.classList.remove('has-parent');
          }
          const contentEl = taskEl.querySelector('.task-content');
          if (contentEl && contentEl !== focusedElement) {
            if (contentEl.contentEditable === 'true') {
              contentEl.spellcheck = false;
            }
            contentEl.innerHTML = task.content || '';
            requestAnimationFrame(() => {
              autoResize(contentEl);
            });
          }
          let hierarchyEl = taskEl.querySelector('.task-hierarchy');
          if (!hierarchyEl) {
            hierarchyEl = createTaskHierarchy(task, todos);
            const contentEl = taskEl.querySelector('.task-content');
            if (contentEl) {
              taskEl.insertBefore(hierarchyEl, contentEl);
            }
          }
          let actionsEl = taskEl.querySelector('.task-actions');
          if (!actionsEl) {
            actionsEl = createTaskActions(task.id);
            taskEl.appendChild(actionsEl);
          } else {
            const buttons = actionsEl.querySelectorAll('button[data-action="add-subtask"]');
            buttons.forEach(btn => {
              btn.onclick = (e) => {
                e.stopPropagation();
                if (window.todoApi) {
                  window.todoApi.createTodo('', task.id).then(() => {
                    return window.todoApi.getTodos();
                  }).then(todos => {
                    currentTodos = todos;
                    renderTasks(todos, true);
                  });
                }
              };
            });
          }
          if (contentEl && !contentEl.hasAttribute('data-click-handler')) {
            contentEl.setAttribute('data-click-handler', 'true');
            contentEl.addEventListener('click', (e) => {
              e.stopPropagation();
              document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
              taskEl.classList.add('active');
              activeTaskId = task.id;
            });
          }
          if (activeTaskId === task.id) {
            taskEl.classList.add('active');
          }
        }
        
        const children = todos.filter(t => t.parentId === task.id && !t.completed);
        children.sort((a, b) => (a.order || 0) - (b.order || 0));
        children.forEach(child => renderTask(child, todos, container));
      }
      
      function renderTasks(todos, preserveExisting = false) {
        currentTodos = todos;
        const container = document.getElementById('todo-container');
        if (!container) return;
        
        if (!preserveExisting) {
          container.innerHTML = '';
          activeTaskId = null;
        } else {
          const existingIds = new Set(Array.from(container.querySelectorAll('[data-task-id]')).map(el => el.dataset.taskId));
          const currentIds = new Set(todos.filter(t => !t.completed).map(t => t.id));
          existingIds.forEach(id => {
            if (!currentIds.has(id)) {
              const el = container.querySelector(`[data-task-id="${id}"]`);
              if (el) el.remove();
              if (activeTaskId === id) {
                activeTaskId = null;
              }
            }
          });
        }
        
        const rootTasks = todos.filter(t => !t.parentId && !t.completed);
        rootTasks.sort((a, b) => (a.order || 0) - (b.order || 0));
        
        rootTasks.forEach(task => renderTask(task, todos, container));
        
        requestAnimationFrame(() => {
          const allContentElements = container.querySelectorAll('.task-content');
          allContentElements.forEach(el => {
            if (el !== focusedElement) {
              autoResize(el);
            }
          });
          setTimeout(() => {
            drawHierarchyLines(todos, container);
          }, 0);
        });
      }
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.task')) {
          document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
          activeTaskId = null;
        }
      });
      
      document.addEventListener('keydown', (e) => {
        if (focusedElement && document.activeElement === focusedElement) {
          return;
        }
        
        if (!activeTaskId) return;
        
        if (matchesHotkey(e, todoHotkeys.addSubtask)) {
          e.preventDefault();
          if (window.todoApi) {
            window.todoApi.createTodo('', activeTaskId).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        } else if (matchesHotkey(e, todoHotkeys.execute)) {
          e.preventDefault();
          const task = currentTodos.find(t => t.id === activeTaskId);
          if (window.todoApi && task) {
            window.todoApi.startTimer(task.motivationWord || null);
          }
        } else if (matchesHotkey(e, todoHotkeys.complete)) {
          e.preventDefault();
          if (window.todoApi) {
            window.todoApi.updateTodo(activeTaskId, { 
              completed: true, 
              completedAt: Date.now() 
            }).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        }
      });
      
      if (window.todoApi) {
        window.todoApi.getTodoHotkeys().then(hotkeys => {
          todoHotkeys = hotkeys;
        });
        
        window.todoApi.getTodos().then(todos => {
          if (todos.length === 0) {
            window.todoApi.loadLargeDemo().then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              renderTasks(todos, false);
            }).catch(() => {
              renderTasks([], false);
            });
          } else {
            renderTasks(todos, false);
          }
        });
        
        window.todoApi.onTodosUpdated((todos) => {
          renderTasks(todos, focusedElement !== null);
        });
      }
      
      window.loadLargeDemo = function() {
        if (window.todoApi) {
          window.todoApi.loadLargeDemo().then(() => {
            return window.todoApi.getTodos();
          }).then(todos => {
            renderTasks(todos, false);
          });
        }
      };
    </script>
  </body>
</html>
