<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Todo List</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 100vw;
        height: 100vh;
        overflow-y: auto;
        background: #1a1a1a;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #todo-container {
        width: 100%;
        position: relative;
      }
      #hierarchy-svg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 1;
        overflow: visible;
      }
      .task {
        width: 100%;
        min-height: 40px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        position: relative;
        align-items: center;
      }
      .task-hierarchy {
        display: none;
      }
      .task-expander {
        flex-shrink: 0;
        width: 16px;
        height: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        color: inherit;
        user-select: none;
        align-self: center;
      }
      .task-expander:hover {
        opacity: 0.8;
      }
      .task-expander-icon {
        font-size: 12px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hierarchy-line {
        position: absolute;
        background: rgba(255, 255, 255, 0.7);
        pointer-events: none;
        z-index: 0;
      }
      .hierarchy-line-vertical {
        width: 1px;
      }
      .hierarchy-line-horizontal {
        height: 1px;
      }
      .hierarchy-dot {
        position: absolute;
        width: 4px;
        height: 4px;
        background: rgba(255, 255, 255, 0.9);
        border-radius: 50%;
        pointer-events: none;
        z-index: 1;
      }
      .hierarchy-svg-line {
        stroke: rgba(255, 255, 255, 0.7) !important;
        stroke-width: 1 !important;
        fill: none;
      }
      .hierarchy-svg-dot {
        fill: rgba(255, 255, 255, 0.9);
      }
      .task-content {
        position: relative;
        z-index: 0;
      }
      .task-group-separator {
        height: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .task-content {
        width: 100%;
        min-height: 40px;
        padding: 12px;
        outline: none;
        word-wrap: break-word;
        white-space: pre-wrap;
        overflow: hidden;
        resize: none;
        color: #fff;
        background: transparent;
      }
      .task-content:focus {
        background: rgba(255, 255, 255, 0.05);
      }
      .task-actions {
        display: none;
        padding: 8px 12px 8px 12px;
        padding-right: 24px;
        background: rgba(0, 0, 0, 0.3);
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        flex-wrap: nowrap;
      }
      .task.active .task-actions {
        display: flex;
        gap: 8px;
      }
      .task-actions button {
        padding: 4px 8px;
        background: rgba(255, 255, 255, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: #fff;
        cursor: pointer;
        font-size: 16px;
        line-height: 1;
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 28px;
      }
      .task-actions button:hover {
        background: rgba(255, 255, 255, 0.2);
      }
    </style>
  </head>
  <body>
    <div id="todo-container">
      <svg id="hierarchy-svg" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
    <script>
      const COLORS = ['#8B00FF', '#0000FF', '#00FFFF', '#00FF00', '#FFFF00', '#FF7F00', '#FF0000'];
      
      function getColorForLevel(level) {
        if (level < 0) return COLORS[0];
        if (level >= COLORS.length) return COLORS[COLORS.length - 1];
        return COLORS[level];
      }
      
      function calculateLevel(task, todos) {
        if (!task.parentId) return 0;
        const parent = todos.find(t => t.id === task.parentId);
        if (!parent) return 0;
        return calculateLevel(parent, todos) + 1;
      }
      
      function getAncestors(task, todos) {
        const ancestors = [];
        let current = task;
        while (current.parentId) {
          const parent = todos.find(t => t.id === current.parentId);
          if (!parent) break;
          ancestors.push(parent);
          current = parent;
        }
        return ancestors.reverse();
      }
      
      function isTaskVisible(task, todos) {
        if (!task.parentId) return true;
        const parent = todos.find(t => t.id === task.parentId);
        if (!parent) return true;
        if (parent.collapsed) return false;
        return isTaskVisible(parent, todos);
      }
      
      function shouldContinueAncestorLine(ancestor, currentTask, todos) {
        const ancestorChildren = todos.filter(t => t.parentId === ancestor.id && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
        if (ancestorChildren.length === 0) return false;
        
        const lastChild = ancestorChildren[ancestorChildren.length - 1];
        if (isTaskDescendant(lastChild, currentTask, todos)) {
          return false;
        }
        
        let foundCurrent = false;
        for (const child of ancestorChildren) {
          if (isTaskDescendant(child, currentTask, todos)) {
            foundCurrent = true;
            continue;
          }
          if (foundCurrent) {
            return true;
          }
        }
        return false;
      }
      
      function isTaskDescendant(ancestor, task, todos) {
        if (ancestor.id === task.id) return true;
        const children = todos.filter(t => t.parentId === ancestor.id && !t.completed);
        for (const child of children) {
          if (isTaskDescendant(child, task, todos)) return true;
        }
        return false;
      }
      
      function autoResize(element) {
        if (!element) return;
        const currentHeight = element.style.height;
        element.style.height = 'auto';
        const scrollHeight = element.scrollHeight;
        const minHeight = 40;
        const newHeight = Math.max(minHeight, scrollHeight);
        element.style.height = newHeight + 'px';
      }
      
      let updateTimeout = null;
      let focusedElement = null;
      let focusedTaskId = null;
      let activeTaskId = null;
      let currentTodos = [];
      let todoHotkeys = {
        addSubtask: 'Insert',
        execute: 'F5',
        complete: 'Delete'
      };
      
      function parseHotkey(hotkeyString) {
        const parts = hotkeyString.split('+').map(p => p.trim());
        const modifiers = {
          ctrl: false,
          alt: false,
          shift: false,
          meta: false
        };
        let key = null;
        
        for (const part of parts) {
          const lower = part.toLowerCase();
          if (lower === 'ctrl' || lower === 'control') {
            modifiers.ctrl = true;
          } else if (lower === 'alt') {
            modifiers.alt = true;
          } else if (lower === 'shift') {
            modifiers.shift = true;
          } else if (lower === 'meta' || lower === 'cmd') {
            modifiers.meta = true;
          } else {
            key = part;
          }
        }
        
        return { modifiers, key };
      }
      
      function matchesHotkey(event, hotkeyString) {
        const parsed = parseHotkey(hotkeyString);
        const eventKey = event.key;
        const eventCode = event.code;
        
        const keyMap = {
          'Insert': 'Insert',
          'Delete': 'Delete',
          'F5': 'F5',
          'Enter': 'Enter',
          'Space': ' ',
          'Esc': 'Escape'
        };
        
        let keyMatches = false;
        if (keyMap[parsed.key]) {
          keyMatches = keyMap[parsed.key] === eventKey;
        } else if (parsed.key && parsed.key.length === 1) {
          keyMatches = parsed.key.toLowerCase() === eventKey.toLowerCase() || 
                       parsed.key === eventKey ||
                       parsed.key === eventCode;
        } else {
          keyMatches = parsed.key === eventKey || parsed.key === eventCode;
        }
        
        if (!keyMatches) return false;
        
        if (parsed.modifiers.ctrl !== event.ctrlKey) return false;
        if (parsed.modifiers.alt !== event.altKey) return false;
        if (parsed.modifiers.shift !== event.shiftKey) return false;
        if (parsed.modifiers.meta !== event.metaKey) return false;
        
        return true;
      }
      
      function setupRichEditor(element, taskId) {
        element.addEventListener('focus', () => {
          focusedElement = element;
          focusedTaskId = taskId;
        });
        
        element.addEventListener('blur', () => {
          if (focusedElement === element) {
            focusedElement = null;
            focusedTaskId = null;
          }
        });
        
        element.addEventListener('input', () => {
          autoResize(element);
          if (window.todoApi) {
            clearTimeout(updateTimeout);
            updateTimeout = setTimeout(() => {
              window.todoApi.updateTodo(taskId, { content: element.innerHTML });
              if (currentTodos) {
                const container = document.getElementById('todo-container');
                if (container) {
                  setTimeout(() => drawHierarchyLines(currentTodos, container), 50);
                }
              }
            }, 300);
          }
        });
        
        element.addEventListener('paste', (e) => {
          e.preventDefault();
          const text = (e.clipboardData || window.clipboardData).getData('text/plain');
          const selection = window.getSelection();
          if (!selection.rangeCount) return;
          
          const range = selection.getRangeAt(0);
          range.deleteContents();
          const textNode = document.createTextNode(text);
          range.insertNode(textNode);
          range.setStartAfter(textNode);
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          
          autoResize(element);
          if (window.todoApi) {
            window.todoApi.updateTodo(taskId, { content: element.innerHTML });
          }
        });
        
        setTimeout(() => {
          autoResize(element);
        }, 0);
      }
      
      function createTaskActions(taskId) {
        const actionsEl = document.createElement('div');
        actionsEl.className = 'task-actions';
        
        const addSubtaskBtn = document.createElement('button');
        addSubtaskBtn.textContent = '+';
        addSubtaskBtn.title = 'Добавить подзадачу';
        addSubtaskBtn.dataset.action = 'add-subtask';
        addSubtaskBtn.onclick = (e) => {
          e.stopPropagation();
          if (window.todoApi) {
            window.todoApi.createTodo('', taskId).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        };
        
        const executeBtn = document.createElement('button');
        executeBtn.textContent = '▶';
        executeBtn.title = 'Выполнить';
        executeBtn.dataset.action = 'execute';
        executeBtn.onclick = (e) => {
          e.stopPropagation();
          const task = currentTodos.find(t => t.id === taskId);
          if (window.todoApi && task) {
            window.todoApi.startTimer(task.motivationWord || null);
          }
        };
        
        const completeBtn = document.createElement('button');
        completeBtn.textContent = '✓';
        completeBtn.title = 'Выполнено';
        completeBtn.dataset.action = 'complete';
        completeBtn.onclick = (e) => {
          e.stopPropagation();
          if (window.todoApi) {
            window.todoApi.updateTodo(taskId, { 
              completed: true, 
              completedAt: Date.now() 
            }).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        };
        
        actionsEl.appendChild(addSubtaskBtn);
        actionsEl.appendChild(executeBtn);
        actionsEl.appendChild(completeBtn);
        
        return actionsEl;
      }
      
      function createTaskExpander(task, todos) {
        const expanderEl = document.createElement('div');
        expanderEl.className = 'task-expander';
        expanderEl.dataset.taskId = task.id;
        const level = calculateLevel(task, todos);
        expanderEl.dataset.level = level;
        expanderEl.style.marginLeft = `${8 + level * 9}px`;
        
        const iconEl = document.createElement('div');
        iconEl.className = 'task-expander-icon';
        
        const hasChildrenTasks = hasChildren(task, todos);
        if (!hasChildrenTasks) {
          iconEl.textContent = '●';
          iconEl.style.fontSize = '10px';
          iconEl.style.lineHeight = '1';
        } else if (task.collapsed) {
          iconEl.textContent = '▶';
          iconEl.style.fontSize = '12px';
          iconEl.style.lineHeight = '1';
        } else {
          iconEl.textContent = '▼';
          iconEl.style.fontSize = '12px';
          iconEl.style.lineHeight = '1';
        }
        
        expanderEl.appendChild(iconEl);
        
        if (hasChildrenTasks) {
          expanderEl.addEventListener('click', async (e) => {
            e.stopPropagation();
            await window.todoApi.toggleTaskCollapse(task.id);
            const updatedTodos = await window.todoApi.getTodos();
            renderTasks(updatedTodos);
          });
        }
        
        return expanderEl;
      }
      
      function hasChildren(task, todos) {
        return todos.some(t => t.parentId === task.id && !t.completed);
      }
      
      function getSiblings(task, todos) {
        if (!task.parentId) {
          return todos.filter(t => !t.parentId && !t.completed && t.id !== task.id);
        }
        return todos.filter(t => t.parentId === task.parentId && !t.completed && t.id !== task.id);
      }
      
      function isLastChild(task, todos) {
        if (!task.parentId) {
          const rootTasks = todos.filter(t => !t.parentId && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
          return rootTasks.length === 0 || rootTasks[rootTasks.length - 1].id === task.id;
        }
        const siblings = todos.filter(t => t.parentId === task.parentId && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
        return siblings.length === 0 || siblings[siblings.length - 1].id === task.id;
      }
      
      function getLastDescendant(task, todos) {
        const children = todos.filter(t => t.parentId === task.id && !t.completed).sort((a, b) => (a.order || 0) - (b.order || 0));
        if (children.length === 0) return task;
        return getLastDescendant(children[children.length - 1], todos);
      }
      
      function getLastVisibleDescendant(task, todos) {
        if (task.collapsed) return task;
        const children = todos.filter(t => t.parentId === task.id && !t.completed && isTaskVisible(t, todos)).sort((a, b) => (a.order || 0) - (b.order || 0));
        if (children.length === 0) return task;
        return getLastVisibleDescendant(children[children.length - 1], todos);
      }
      
      function drawHierarchyLines(todos, container) {
        if (!container) {
          console.error('[drawHierarchyLines] Container not provided');
          return;
        }
        
        let svg = container.querySelector('#hierarchy-svg');
        if (!svg) {
          console.warn('[drawHierarchyLines] SVG element not found, creating it');
          svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
          svg.id = 'hierarchy-svg';
          svg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
          if (container.firstChild) {
            container.insertBefore(svg, container.firstChild);
          } else {
            container.appendChild(svg);
          }
        }
        
        console.log('[drawHierarchyLines] Starting, todos count:', todos.length);
        
        while (svg.firstChild) {
          svg.removeChild(svg.firstChild);
        }
        
        const containerRect = container.getBoundingClientRect();
        const svgRect = svg.getBoundingClientRect();
        const scrollTop = container.scrollTop;
        
        console.log('[drawHierarchyLines] Container rect:', containerRect);
        console.log('[drawHierarchyLines] SVG rect:', svgRect);
        console.log('[drawHierarchyLines] Scroll top:', scrollTop);
        
        const taskElements = Array.from(container.querySelectorAll('.task'));
        const taskElementMap = new Map();
        taskElements.forEach(el => {
          const taskId = el.dataset.taskId;
          if (taskId) {
            taskElementMap.set(taskId, el);
          }
        });
        
        const tasksInOrder = [];
        taskElements.forEach(el => {
          const taskId = el.dataset.taskId;
          if (taskId) {
            tasksInOrder.push({ id: taskId, element: el });
          }
        });
        
        const getTaskRect = (taskId) => {
          const el = taskElementMap.get(taskId);
          if (!el) return null;
          const rect = el.getBoundingClientRect();
          const svgRect = svg.getBoundingClientRect();
          return {
            top: rect.top - svgRect.top + scrollTop,
            height: rect.height,
            center: rect.top - svgRect.top + scrollTop + rect.height / 2,
            bottom: rect.top - svgRect.top + scrollTop + rect.height
          };
        };
        
        const getExpanderRect = (taskId) => {
          const expanderEl = container.querySelector(`.task-expander[data-task-id="${taskId}"]`);
          if (!expanderEl) {
            console.warn(`[getExpanderRect] Expander not found for task ${taskId}`);
            return null;
          }
          const rect = expanderEl.getBoundingClientRect();
          const svgRect = svg.getBoundingClientRect();
          const result = {
            left: rect.left - svgRect.left,
            top: rect.top - svgRect.top + scrollTop,
            bottom: rect.bottom - svgRect.top + scrollTop,
            height: rect.height,
            width: rect.width,
            centerX: rect.left - svgRect.left + rect.width / 2
          };
          console.log(`[getExpanderRect] Task ${taskId}:`, result, 'rect:', rect, 'svgRect:', svgRect);
          return result;
        };
        
        const visibleTasks = todos.filter(t => !t.completed && isTaskVisible(t, todos));
        console.log('[drawHierarchyLines] Visible tasks:', visibleTasks.length);
        
        const parentTasks = visibleTasks.filter(t => hasChildren(t, todos) && !t.collapsed);
        console.log('[drawHierarchyLines] Expanded parent tasks:', parentTasks.length);
        
        let verticalLinesCount = 0;
        
        parentTasks.forEach(parentTask => {
          const parentExpanderRect = getExpanderRect(parentTask.id);
          if (!parentExpanderRect) return;
          
          const parentTaskRect = getTaskRect(parentTask.id);
          if (!parentTaskRect) return;
          
          const lineX = parentExpanderRect.left;
          const lineHeight = 20;
          const lineTop = parentExpanderRect.bottom + lineHeight;
          
          const lastVisibleDescendant = getLastVisibleDescendant(parentTask, todos);
          const lastDescendantRect = getTaskRect(lastVisibleDescendant.id);
          if (!lastDescendantRect) return;
          
          const lineBottom = lastDescendantRect.bottom;
          
          if (lineBottom > lineTop && lineX > 0) {
            const verticalLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
            verticalLine.setAttribute('x1', lineX.toString());
            verticalLine.setAttribute('y1', lineTop.toString());
            verticalLine.setAttribute('x2', lineX.toString());
            verticalLine.setAttribute('y2', lineBottom.toString());
            verticalLine.setAttribute('class', 'hierarchy-svg-line');
            verticalLine.setAttribute('stroke', 'rgba(255, 255, 255, 0.9)');
            verticalLine.setAttribute('stroke-width', '1');
            svg.appendChild(verticalLine);
            verticalLinesCount++;
            console.log(`[drawHierarchyLines] Added vertical line for task ${parentTask.id}: x=${lineX}, top=${lineTop}, bottom=${lineBottom}`);
          }
        });
        
        console.log(`[drawHierarchyLines] Added ${verticalLinesCount} vertical lines`);
        
        const containerHeight = Math.max(container.scrollHeight, containerRect.height);
        const svgWidth = containerRect.width;
        const svgHeight = containerHeight;
        
        svg.setAttribute('width', svgWidth.toString());
        svg.setAttribute('height', svgHeight.toString());
        svg.setAttribute('viewBox', `0 0 ${svgWidth} ${svgHeight}`);
        svg.setAttribute('preserveAspectRatio', 'none');
        svg.style.width = '100%';
        svg.style.height = `${svgHeight}px`;
        svg.style.position = 'absolute';
        svg.style.top = '0';
        svg.style.left = '0';
        svg.style.overflow = 'visible';
        
        console.log(`[drawHierarchyLines] SVG configured: width=${svgWidth}, height=${svgHeight}, viewBox=0 0 ${svgWidth} ${svgHeight}`);
        console.log(`[drawHierarchyLines] SVG children count: ${svg.children.length}`);
        console.log(`[drawHierarchyLines] SVG computed style:`, {
          display: window.getComputedStyle(svg).display,
          visibility: window.getComputedStyle(svg).visibility,
          opacity: window.getComputedStyle(svg).opacity,
          zIndex: window.getComputedStyle(svg).zIndex,
          position: window.getComputedStyle(svg).position
        });
        
        if (svg.children.length > 0) {
          const firstChild = svg.children[0];
          console.log(`[drawHierarchyLines] First child:`, firstChild.tagName, firstChild.getAttribute('x1'), firstChild.getAttribute('y1'));
        }
        
      }
      
      function renderTask(task, todos, container) {
        const level = calculateLevel(task, todos);
        
        let taskEl = container.querySelector(`[data-task-id="${task.id}"]`);
        
        if (!taskEl) {
          taskEl = document.createElement('div');
          taskEl.className = 'task';
          taskEl.dataset.taskId = task.id;
          if (task.parentId) {
            taskEl.classList.add('has-parent');
          }
          
          const expanderEl = createTaskExpander(task, todos);
          
          const contentEl = document.createElement('div');
          contentEl.className = 'task-content';
          contentEl.contentEditable = 'true';
          contentEl.spellcheck = false;
          contentEl.innerHTML = task.content || '';
          
          contentEl.setAttribute('data-click-handler', 'true');
          contentEl.addEventListener('click', (e) => {
            e.stopPropagation();
            document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
            taskEl.classList.add('active');
            activeTaskId = task.id;
          });
          
          const actionsEl = createTaskActions(task.id);
          
          taskEl.appendChild(expanderEl);
          taskEl.appendChild(contentEl);
          taskEl.appendChild(actionsEl);
          container.appendChild(taskEl);
          
          setupRichEditor(contentEl, task.id);
          requestAnimationFrame(() => {
            autoResize(contentEl);
            setTimeout(() => {
              if (currentTodos) {
                drawHierarchyLines(currentTodos, container);
              }
            }, 0);
          });
        } else {
          if (task.parentId) {
            taskEl.classList.add('has-parent');
          } else {
            taskEl.classList.remove('has-parent');
          }
          const contentEl = taskEl.querySelector('.task-content');
          if (contentEl && contentEl !== focusedElement) {
            if (contentEl.contentEditable === 'true') {
              contentEl.spellcheck = false;
            }
            contentEl.innerHTML = task.content || '';
            requestAnimationFrame(() => {
              autoResize(contentEl);
            });
          }
          let expanderEl = taskEl.querySelector('.task-expander');
          if (!expanderEl) {
            expanderEl = createTaskExpander(task, todos);
            const contentEl = taskEl.querySelector('.task-content');
            if (contentEl) {
              taskEl.insertBefore(expanderEl, contentEl);
            }
          } else {
            const taskLevel = calculateLevel(task, todos);
            expanderEl.dataset.level = taskLevel;
            expanderEl.style.marginLeft = `${8 + taskLevel * 9}px`;
            const iconEl = expanderEl.querySelector('.task-expander-icon');
            if (iconEl) {
              const hasChildrenTasks = hasChildren(task, todos);
              if (!hasChildrenTasks) {
                iconEl.textContent = '●';
                iconEl.style.fontSize = '10px';
                iconEl.style.lineHeight = '1';
              } else if (task.collapsed) {
                iconEl.textContent = '▶';
                iconEl.style.fontSize = '12px';
                iconEl.style.lineHeight = '1';
              } else {
                iconEl.textContent = '▼';
                iconEl.style.fontSize = '12px';
                iconEl.style.lineHeight = '1';
              }
            }
          }
          let actionsEl = taskEl.querySelector('.task-actions');
          if (!actionsEl) {
            actionsEl = createTaskActions(task.id);
            taskEl.appendChild(actionsEl);
          } else {
            const buttons = actionsEl.querySelectorAll('button[data-action="add-subtask"]');
            buttons.forEach(btn => {
              btn.onclick = (e) => {
                e.stopPropagation();
                if (window.todoApi) {
                  window.todoApi.createTodo('', task.id).then(() => {
                    return window.todoApi.getTodos();
                  }).then(todos => {
                    currentTodos = todos;
                    renderTasks(todos, true);
                  });
                }
              };
            });
          }
          if (contentEl && !contentEl.hasAttribute('data-click-handler')) {
            contentEl.setAttribute('data-click-handler', 'true');
            contentEl.addEventListener('click', (e) => {
              e.stopPropagation();
              document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
              taskEl.classList.add('active');
              activeTaskId = task.id;
            });
          }
          if (activeTaskId === task.id) {
            taskEl.classList.add('active');
          }
        }
        
        if (!task.collapsed) {
          const children = todos.filter(t => t.parentId === task.id && !t.completed && isTaskVisible(t, todos));
          children.sort((a, b) => (a.order || 0) - (b.order || 0));
          children.forEach(child => renderTask(child, todos, container));
        }
      }
      
      function renderTasks(todos, preserveExisting = false) {
        currentTodos = todos;
        const container = document.getElementById('todo-container');
        if (!container) return;
        
        if (!preserveExisting) {
          const svg = container.querySelector('#hierarchy-svg');
          container.innerHTML = '';
          if (svg) {
            container.appendChild(svg);
          }
          activeTaskId = null;
        } else {
          const existingIds = new Set(Array.from(container.querySelectorAll('[data-task-id]')).map(el => el.dataset.taskId));
          const currentIds = new Set(todos.filter(t => !t.completed).map(t => t.id));
          existingIds.forEach(id => {
            if (!currentIds.has(id)) {
              const el = container.querySelector(`[data-task-id="${id}"]`);
              if (el) el.remove();
              if (activeTaskId === id) {
                activeTaskId = null;
              }
            }
          });
        }
        
        const rootTasks = todos.filter(t => !t.parentId && !t.completed && isTaskVisible(t, todos));
        rootTasks.sort((a, b) => (a.order || 0) - (b.order || 0));
        
        rootTasks.forEach(task => renderTask(task, todos, container));
        
        requestAnimationFrame(() => {
          const allContentElements = container.querySelectorAll('.task-content');
          allContentElements.forEach(el => {
            if (el !== focusedElement) {
              autoResize(el);
            }
          });
          setTimeout(() => {
            const svg = container.querySelector('#hierarchy-svg');
            if (!svg) {
              const newSvg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
              newSvg.id = 'hierarchy-svg';
              newSvg.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
              container.insertBefore(newSvg, container.firstChild);
            }
            drawHierarchyLines(todos, container);
          }, 50);
        });
      }
      
      let scrollTimeout = null;
      const container = document.getElementById('todo-container');
      if (container) {
        container.addEventListener('scroll', () => {
          if (scrollTimeout) clearTimeout(scrollTimeout);
          scrollTimeout = setTimeout(() => {
            if (currentTodos) {
              drawHierarchyLines(currentTodos, container);
            }
          }, 50);
        });
      }
      
      document.addEventListener('click', (e) => {
        if (!e.target.closest('.task')) {
          document.querySelectorAll('.task').forEach(t => t.classList.remove('active'));
          activeTaskId = null;
        }
      });
      
      document.addEventListener('keydown', (e) => {
        if (focusedElement && document.activeElement === focusedElement) {
          return;
        }
        
        if (!activeTaskId) return;
        
        if (matchesHotkey(e, todoHotkeys.addSubtask)) {
          e.preventDefault();
          if (window.todoApi) {
            window.todoApi.createTodo('', activeTaskId).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        } else if (matchesHotkey(e, todoHotkeys.execute)) {
          e.preventDefault();
          const task = currentTodos.find(t => t.id === activeTaskId);
          if (window.todoApi && task) {
            window.todoApi.startTimer(task.motivationWord || null);
          }
        } else if (matchesHotkey(e, todoHotkeys.complete)) {
          e.preventDefault();
          if (window.todoApi) {
            window.todoApi.updateTodo(activeTaskId, { 
              completed: true, 
              completedAt: Date.now() 
            }).then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              currentTodos = todos;
              renderTasks(todos, true);
            });
          }
        }
      });
      
      if (window.todoApi) {
        window.todoApi.getTodoHotkeys().then(hotkeys => {
          todoHotkeys = hotkeys;
        });
        
        window.todoApi.getTodos().then(todos => {
          if (todos.length === 0) {
            window.todoApi.loadLargeDemo().then(() => {
              return window.todoApi.getTodos();
            }).then(todos => {
              renderTasks(todos, false);
            }).catch(() => {
              renderTasks([], false);
            });
          } else {
            renderTasks(todos, false);
          }
        });
        
        window.todoApi.onTodosUpdated((todos) => {
          renderTasks(todos, focusedElement !== null);
        });
      }
      
      window.loadLargeDemo = function() {
        if (window.todoApi) {
          window.todoApi.loadLargeDemo().then(() => {
            return window.todoApi.getTodos();
          }).then(todos => {
            renderTasks(todos, false);
          });
        }
      };
    </script>
  </body>
</html>
