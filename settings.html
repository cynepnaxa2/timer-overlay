<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Настройки Timer Overlay</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
        margin: 0;
        padding: 16px;
        background: #f5f5f5;
      }
      .container {
        max-width: 500px;
        margin: 0 auto;
        background: white;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      }
      h1 {
        font-size: 18px;
        margin: 0 0 20px 0;
        color: #333;
      }
      .section {
        margin-bottom: 24px;
        padding-bottom: 20px;
        border-bottom: 1px solid #e0e0e0;
      }
      .section:last-child {
        border-bottom: none;
      }
      .section-title {
        font-size: 13px;
        font-weight: 600;
        color: #666;
        margin-bottom: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .row {
        margin-bottom: 16px;
      }
      .row:last-child {
        margin-bottom: 0;
      }
      label {
        display: block;
        font-size: 13px;
        color: #333;
        margin-bottom: 6px;
        font-weight: 500;
      }
      .input-group {
        display: flex;
        align-items: center;
        gap: 12px;
      }
      input[type="range"] {
        flex: 1;
        height: 6px;
      }
      input[type="number"], input[type="text"] {
        width: 80px;
        padding: 6px 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
      }
      input[type="number"]:focus, input[type="text"]:focus {
        outline: none;
        border-color: #0078d4;
      }
      input[type="color"] {
        width: 60px;
        height: 36px;
        border: 1px solid #ddd;
        border-radius: 4px;
        cursor: pointer;
      }
      select {
        width: 100%;
        padding: 8px;
        border: 1px solid #ddd;
        border-radius: 4px;
        font-size: 13px;
        background: white;
      }
      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 0;
        cursor: pointer;
      }
      .checkbox-row input[type="checkbox"] {
        margin: 0;
        cursor: pointer;
      }
      .checkbox-row label {
        margin: 0;
        cursor: pointer;
        font-weight: normal;
      }
      .preview-container {
        background: #f9f9f9;
        border: 2px dashed #ddd;
        border-radius: 8px;
        padding: 30px;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 150px;
        margin-top: 12px;
      }
      .preview-circle {
        border-radius: 50%;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.2);
        transition: all 0.2s ease;
      }
      .actions {
        margin-top: 24px;
        display: flex;
        gap: 10px;
        justify-content: flex-end;
      }
      button {
        padding: 10px 20px;
        border: none;
        border-radius: 4px;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.2s;
      }
      button#apply {
        background: #0078d4;
        color: white;
      }
      button#apply:hover:not(:disabled) {
        background: #106ebe;
      }
      button#apply:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      button#close {
        background: #e0e0e0;
        color: #333;
      }
      button#close:hover {
        background: #d0d0d0;
      }
      .unit {
        font-size: 12px;
        color: #666;
        margin-left: 4px;
      }
      .mode-description {
        font-size: 12px;
        color: #666;
        margin-top: 8px;
        padding: 8px;
        background: #f9f9f9;
        border-radius: 4px;
      }
      .total-counter {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        margin-top: 8px;
      }
      .counter-item {
        padding: 12px;
        background: #f9f9f9;
        border-radius: 6px;
        border-left: 3px solid #0078d4;
      }
      .counter-item-header {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 600;
        font-size: 13px;
        margin-bottom: 6px;
        color: #333;
      }
      .counter-item-value {
        font-size: 18px;
        font-weight: 700;
        color: #0078d4;
        margin-bottom: 4px;
      }
      .counter-item-time {
        font-size: 11px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>⚙️ Настройки Timer Overlay</h1>

      <!-- Системные настройки -->
      <div class="section">
        <div class="section-title">Система</div>
        <div class="checkbox-row">
          <input id="autostart" type="checkbox">
          <label for="autostart">Запускать вместе с Windows</label>
        </div>
        <div class="checkbox-row">
          <input id="showTray" type="checkbox">
          <label for="showTray">Показывать иконку в системном трее</label>
        </div>
      </div>

      <!-- Режим мотивации -->
      <div class="section">
        <div class="section-title">Зачем будем сейчас работать?</div>
        <div class="row">
          <label for="mode">Выберите режим мотивации:</label>
          <select id="mode"></select>
        </div>
        <div id="modeDescription" class="mode-description"></div>
      </div>

      <!-- Суммарный счетчик -->
      <div class="section">
        <div class="section-title">Ваша статистика</div>
        <div id="totalCounter" class="total-counter"></div>
      </div>

      <!-- Превью -->
      <div class="section">
        <div class="section-title">Предпросмотр</div>
        <div class="preview-container">
          <div id="previewCircle" class="preview-circle"></div>
        </div>
      </div>

      <!-- Внешний вид -->
      <div class="section">
        <div class="section-title">Внешний вид</div>
        
        <div class="row">
          <label for="diameter">Размер круга<span class="unit">(10-200 пикселей)</span></label>
          <div class="input-group">
            <input id="diameter" type="range" min="10" max="200" step="1">
            <input id="diameterText" type="number" min="10" max="200" step="1">
          </div>
        </div>

        <div class="row">
          <label for="opacity">Прозрачность<span class="unit">(0.1-1.0)</span></label>
          <div class="input-group">
            <input id="opacity" type="range" min="0.1" max="1" step="0.01">
            <input id="opacityText" type="number" min="0.1" max="1" step="0.01">
          </div>
        </div>

        <div class="row">
          <label for="color">Цвет круга</label>
          <input id="color" type="color">
        </div>
      </div>

      <!-- Анимация -->
      <div class="section">
        <div class="section-title">Анимация</div>
        
        <div class="row">
          <label for="duration">Длительность цикла<span class="unit">(5-300 секунд)</span></label>
          <div class="input-group">
            <input id="duration" type="range" min="5" max="300" step="1">
            <input id="durationText" type="number" min="5" max="300" step="1">
          </div>
        </div>

        <div class="row">
          <label for="timing">Стиль движения</label>
          <select id="timing">
            <option value="linear">Плавное движение</option>
            <option value="steps">Пошаговое (1/60 в секунду)</option>
          </select>
        </div>
      </div>

      <div class="actions">
        <button id="close">Закрыть</button>
        <button id="apply">Применить</button>
      </div>
    </div>

    <script>
      const $ = (id) => document.getElementById(id);
      const values = {
        diameterPx: 60,
        opacity: 0.55,
        colorHex: '#ff0000',
        durationSeconds: 60,
        stepped: false,
        autostart: false,
        showTray: true,
        mode: 'money',
        counters: {}
      };
      
      let allModes = [];

      function updatePreview() {
        const circle = $('previewCircle');
        const size = Math.max(10, Math.min(200, values.diameterPx || 60));
        const opacity = Math.max(0.1, Math.min(1, values.opacity || 0.55));
        const color = values.colorHex || '#ff0000';
        
        // Convert hex to rgba
        const r = parseInt(color.slice(1, 3), 16);
        const g = parseInt(color.slice(3, 5), 16);
        const b = parseInt(color.slice(5, 7), 16);
        
        circle.style.width = size + 'px';
        circle.style.height = size + 'px';
        circle.style.background = `rgba(${r}, ${g}, ${b}, ${opacity})`;
        circle.style.boxShadow = `0 0 10px rgba(${r}, ${g}, ${b}, 0.7)`;
      }

      function loadModes() {
        // Загружаем режимы через IPC (будет реализовано в main.js)
        // Пока используем статический список
        allModes = [
          { id: 'money', name: 'Деньги', emoji: '💵', description: 'Каждая минута = +$1' },
          { id: 'popularity', name: 'Популярность', emoji: '👍', description: 'Каждая минута = +1 лайк' },
          { id: 'selfDevelopment', name: 'Саморазвитие', emoji: '⬆️', description: 'Каждая минута = +1 XP, каждые 60 XP = +1 уровень' },
          { id: 'success', name: 'Успех', emoji: '🚀', description: 'Каждая минута = +1 очко успеха' },
          { id: 'health', name: 'Здоровье', emoji: '⏰', description: 'Каждая минута = -1 минута возраста (помолодел)' },
          { id: 'sport', name: 'Спорт', emoji: '💪', description: 'Каждая минута = +1 грамм мышц' },
          { id: 'creativity', name: 'Творчество', emoji: '🎨', description: 'Каждая минута = +1 единица мастерства' },
          { id: 'learning', name: 'Обучение', emoji: '📚', description: 'Каждая минута = +1 знание' }
        ];
        
        const modeSelect = $('mode');
        modeSelect.innerHTML = '';
        allModes.forEach(mode => {
          const option = document.createElement('option');
          option.value = mode.id;
          option.textContent = `${mode.emoji} ${mode.name}`;
          modeSelect.appendChild(option);
        });
      }
      
      function updateModeDescription() {
        const selectedMode = allModes.find(m => m.id === values.mode);
        if (selectedMode) {
          $('modeDescription').textContent = selectedMode.description;
        }
      }
      
      function updateTotalCounter() {
        const container = $('totalCounter');
        container.innerHTML = '';
        
        if (!values.counters || Object.keys(values.counters).length === 0) {
          container.innerHTML = '<div style="color: #666; font-size: 12px;">Статистика появится после начала работы</div>';
          return;
        }
        
        allModes.forEach(mode => {
          const counter = values.counters[mode.id];
          if (!counter || counter.totalMinutes === 0) return;
          
          const item = document.createElement('div');
          item.className = 'counter-item';
          
          const header = document.createElement('div');
          header.className = 'counter-item-header';
          header.innerHTML = `${mode.emoji} ${mode.name}`;
          
          const value = document.createElement('div');
          value.className = 'counter-item-value';
          // Форматирование значения в зависимости от режима
          if (mode.id === 'selfDevelopment' && typeof counter.value === 'object') {
            value.textContent = `Level ${counter.value.level} (XP: ${counter.value.xp})`;
          } else if (mode.id === 'health') {
            value.textContent = `-${Math.abs(counter.value)} мин`;
          } else if (mode.id === 'sport') {
            value.textContent = `+${counter.value} г`;
          } else if (mode.id === 'money') {
            value.textContent = `$${counter.value}`;
          } else if (mode.id === 'popularity') {
            value.textContent = `👍 ${counter.value}`;
          } else {
            value.textContent = counter.value || 0;
          }
          
          const time = document.createElement('div');
          time.className = 'counter-item-time';
          const hours = Math.floor(counter.totalMinutes / 60);
          const minutes = counter.totalMinutes % 60;
          time.textContent = `Время работы: ${hours > 0 ? hours + 'ч ' : ''}${minutes}мин`;
          
          item.appendChild(header);
          item.appendChild(value);
          item.appendChild(time);
          container.appendChild(item);
        });
      }
      
      function syncUI() {
        $('diameter').value = values.diameterPx;
        $('diameterText').value = values.diameterPx;
        $('opacity').value = values.opacity;
        $('opacityText').value = Number(values.opacity).toFixed(2);
        $('duration').value = values.durationSeconds;
        $('durationText').value = values.durationSeconds;
        $('color').value = values.colorHex;
        $('timing').value = values.stepped ? 'steps' : 'linear';
        $('autostart').checked = values.autostart;
        $('showTray').checked = values.showTray !== false;
        $('mode').value = values.mode || 'money';
        updateModeDescription();
        updateTotalCounter();
        updatePreview();
      }

      function readUI() {
        values.diameterPx = Math.max(10, Math.min(200, Number($('diameterText').value) || Number($('diameter').value)));
        values.opacity = Math.max(0.1, Math.min(1, Number($('opacityText').value) || Number($('opacity').value)));
        values.durationSeconds = Math.max(5, Math.min(300, Number($('durationText').value) || Number($('duration').value)));
        values.colorHex = $('color').value;
        values.stepped = $('timing').value === 'steps';
        values.autostart = $('autostart').checked;
        values.showTray = $('showTray').checked;
        values.mode = $('mode').value;
      }

      function syncFromSlider(id, textId, min, max) {
        const slider = $(id);
        const text = $(textId);
        slider.addEventListener('input', () => {
          const val = Math.max(min, Math.min(max, Number(slider.value)));
          text.value = id === 'opacity' ? val.toFixed(2) : val;
          readUI();
          syncUI();
        });
        text.addEventListener('input', () => {
          const val = Math.max(min, Math.min(max, Number(text.value) || min));
          slider.value = val;
          readUI();
          syncUI();
        });
        text.addEventListener('blur', () => {
          const val = Math.max(min, Math.min(max, Number(text.value) || min));
          text.value = id === 'opacity' ? val.toFixed(2) : val;
          slider.value = val;
          readUI();
          syncUI();
        });
      }

      async function init() {
        loadModes();
        try {
          const s = await window.settingsApi.getSettings();
          Object.assign(values, s);
          // Get actual autostart status from system
          try {
            values.autostart = await window.settingsApi.getAutostart();
          } catch {}
          // Ensure counters object exists
          if (!values.counters) {
            values.counters = {};
          }
        } catch {}
        syncUI();
        
        // Listen for counter updates
        if (window.settingsApi && window.settingsApi.onCountersUpdated) {
          window.settingsApi.onCountersUpdated((counters) => {
            values.counters = counters;
            updateTotalCounter();
          });
        }
      }

      // Sync sliders and text inputs
      syncFromSlider('diameter', 'diameterText', 10, 200);
      syncFromSlider('opacity', 'opacityText', 0.1, 1);
      syncFromSlider('duration', 'durationText', 5, 300);

      $('color').addEventListener('input', () => { readUI(); syncUI(); });
      $('timing').addEventListener('change', () => { readUI(); syncUI(); });
      $('autostart').addEventListener('change', () => { readUI(); syncUI(); });
      $('showTray').addEventListener('change', () => { readUI(); syncUI(); });
      $('mode').addEventListener('change', () => { readUI(); syncUI(); });

      $('apply').addEventListener('click', async () => {
        readUI();
        try {
          await window.settingsApi.updateSettings(values);
          const btn = $('apply');
          const orig = btn.textContent;
          btn.textContent = '✓ Применено';
          btn.disabled = true;
          setTimeout(() => {
            btn.textContent = orig;
            btn.disabled = false;
          }, 1000);
        } catch (err) {
          alert('Ошибка при применении настроек: ' + err.message);
        }
      });
      $('close').addEventListener('click', () => window.close());

      init();
    </script>
  </body>
</html>
